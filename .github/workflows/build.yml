name: Build and numerical checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B out -A x64
      - run: cmake --build out --config Release --parallel
      - run: ctest --test-dir out -C Release --output-on-failure
      - run: python tools/test_cli.py out/Release/LeniascopeCli.exe
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - run: cmake -S . -B out -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build out --parallel
      - run: ctest --test-dir out --output-on-failure
